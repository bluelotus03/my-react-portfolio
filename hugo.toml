baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Ashley Harmon'
theme = ["hugo-embed-pdf-shortcode", "portfolio"]
enableInlineShortcodes = true
[privacy]
  [privacy.disqus]
    disable = false
  [privacy.googleAnalytics]
    disable = false
    respectDoNotTrack = true
  [privacy.instagram]
    disable = false
    simple = false
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = false
  [privacy.x]
    disable = false
    enableDNT = true
    simple = false
  [privacy.youTube]
    disable = false
    privacyEnhanced = true

[menus]
  [[menus.main]]
    name = 'Workshops'
    pageRef = '/#workshops'
    weight = 10

  [[menus.main]]
    name = 'Guides'
    pageRef = '/#guides'
    weight = 20

  [[menus.main]]
    name = 'Web & App'
    pageRef = '/#web-and-app'
    weight = 30
  
  [[menus.main]]
    name = 'Games'
    pageRef = '/#games'
    weight = 40

  [[menus.main]]
    name = 'Courses & Certs'
    pageRef = '/#courses-and-certs'
    weight = 50

  [[menus.main]]
    name = 'Community'
    pageRef = '/#community'
    weight = 60


[module]
  [module.hugoVersion]
    extended = true
    min = '0.146.0'
  [module.imports]
    path = "github.com/hugomods/icons/vendors/font-awesome"