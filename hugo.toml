baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Ashley Harmon'
theme = ["hugo-embed-pdf-shortcode", "portfolio"]
enableInlineShortcodes = true
[privacy]
  [privacy.disqus]
    disable = false
  [privacy.googleAnalytics]
    disable = false
    respectDoNotTrack = true
  [privacy.instagram]
    disable = false
    simple = false
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = false
  [privacy.x]
    disable = false
    enableDNT = true
    simple = false
  [privacy.youTube]
    disable = false
    privacyEnhanced = true

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

[module]
  [module.hugoVersion]
    extended = true
    min = '0.146.0'
  [module.imports]
    path = "github.com/hugomods/icons/vendors/font-awesome"