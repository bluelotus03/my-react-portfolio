<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header>
    {{ partial "header.html" . }}
  </header>

  {{- $environment := hugo.Environment | default "production" -}}
  {{- $body_classes := slice $environment -}}
  {{- $body_classes = $body_classes | append (printf "is-%s" .Kind) -}}

  <main class="{{ delimit $body_classes " " }}">
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
